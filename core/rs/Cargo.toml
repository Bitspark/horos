[package]
name = "bitspark-horos"
version = "0.6.0"
description = "Types and schemas over ontos values: descriptor well-formedness, conformance and diagnostics."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
include = ["src/**", "testdata/**", "README.md", "LICENSE", "NOTICE", "LICENSE-MIT"]

[lib]
name = "horos"
path = "src/lib.rs"

[[bin]]
name = "horos-conform"
path = "src/bin/horos-conform.rs"

[[bin]]
name = "horos-fuzz"
path = "src/bin/horos-fuzz.rs"

[dependencies]
ontos-core = { package = "bitspark-ontos-core", version = "=0.15.0" }
ontos-data = { package = "bitspark-ontos-data", version = "=0.15.0" }
ontos-codec = { package = "bitspark-ontos-codec", version = "=0.15.0" }

[dev-dependencies]
serde_json = "1"
