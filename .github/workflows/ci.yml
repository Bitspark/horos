name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: check (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [public, go, rust, typescript, python, conformance]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: rustup toolchain install --no-self-update
      - name: Public Python dependency
        if: matrix.target == 'python'
        run: git -c credential.helper= clone --depth 1 --branch v0.16.0 https://github.com/Bitspark/ontos.git "$RUNNER_TEMP/ontos"
      - name: Check
        id: check
        env:
          ONTOS_PY_ROOT: ${{ runner.temp }}/ontos
          npm_config_userconfig: /dev/null
          npm_config_globalconfig: ${{ runner.temp }}/empty-global-npmrc
        run: bash scripts/check.sh '${{ matrix.target }}'
      - name: Capture Go formatting corrections
        if: failure() && matrix.target == 'go' && steps.check.outcome == 'failure'
        shell: bash
        run: |
          git ls-files -z 'core/go/*.go' 'core/go/**/*.go' | xargs -0 -r gofmt -w
          git diff --binary -- core/go > "$RUNNER_TEMP/gofmt.patch"
      - name: Save Go formatting corrections
        if: failure() && matrix.target == 'go'
        uses: actions/upload-artifact@v6
        with:
          name: gofmt-patch
          path: ${{ runner.temp }}/gofmt.patch
          if-no-files-found: ignore
          retention-days: 7

  generation:
    name: native type generation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      GOTOOLCHAIN: local
      BITTYPE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Prepare public integration dependencies
        working-directory: tooling/bittype
        run: go mod tidy
      - name: Prepare native compilers
        run: |
          npm install --prefix "$RUNNER_TEMP/horos-tools" --ignore-scripts --no-audit --no-fund typescript@5.9.3
          echo "$RUNNER_TEMP/horos-tools/node_modules/.bin" >> "$GITHUB_PATH"
          docker pull rust:1.90.0
          docker pull gcc:14.2.0
      - name: Check mapping module and native output
        working-directory: tooling/bittype
        run: go test -count=1 -v ./...
      - name: Vet mapping module
        working-directory: tooling/bittype
        run: go vet ./...
      - name: Qualify installed consumer
        working-directory: tooling/bittype
        run: |
          mkdir "$RUNNER_TEMP/installed-consumer"
          cp integration/go/testdata/installed/*_test.go "$RUNNER_TEMP/installed-consumer/"
          cd "$RUNNER_TEMP/installed-consumer"
          go mod init installed.consumer
          go get "github.com/Bitspark/horos/tooling/bittype@$EXPECTED_REVISION"
          test -z "$(go list -m -f '{{if .Replace}}{{.Path}}{{end}}' all)"
          go test -count=1 -v ./...
      - name: Check formatting and dependency metadata
        if: always()
        run: |
          git ls-files -z 'tooling/bittype/*.go' 'tooling/bittype/**/*.go' | xargs -0 -r gofmt -w
          git add -N tooling/bittype/go.sum
          git diff --binary -- tooling/bittype > "$RUNNER_TEMP/generation-corrections.patch"
          git diff --exit-code -- tooling/bittype
      - name: Save formatting and metadata corrections
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: generation-corrections
          path: ${{ runner.temp }}/generation-corrections.patch
          if-no-files-found: ignore
          retention-days: 7
