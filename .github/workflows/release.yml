name: release
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [rehearse, provenance, diagnose, publish, verify]
        default: rehearse
        required: true
      ref:
        description: Exact main revision to rehearse
        default: main
        required: true
      candidate_run:
        description: Successful rehearsal run ID (provenance, diagnose, publish and verify)
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: release-0.8.0
  cancel-in-progress: false
env:
  CANDIDATE: ${{ github.workspace }}/.artifacts/candidate
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.gate.outputs.source }}
      ci: ${{ steps.gate.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          SOURCE_REF: ${{ inputs.ref }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: python3 scripts/release-gate.py

  rehearse:
    if: inputs.mode == 'rehearse'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: rustup toolchain install --no-self-update
      - name: Build immutable candidates and rehearse uploads
        run: python3 scripts/package.py prepare "$CANDIDATE"
      - name: Test installed candidate archives
        run: python3 scripts/consumer.py candidate "$CANDIDATE"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-0.8.0
          path: ${{ env.CANDIDATE }}
          if-no-files-found: error

  provenance:
    if: inputs.mode == 'provenance'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the provenance implementation used by the native publisher
        run: npm install --global --ignore-scripts npm@12.2.1 --registry=https://registry.npmjs.org/
      - name: Retrieve the accepted rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.candidate_run }}
        run: gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name candidate-0.8.0 --dir "$CANDIDATE"
      - name: Sign the accepted archive without publishing
        run: |
          python3 scripts/package.py check "$CANDIDATE"
          node scripts/provenance.cjs "$CANDIDATE"
      - uses: actions/upload-artifact@v4
        with:
          name: provenance-0.8.0
          path: ${{ env.CANDIDATE }}
          if-no-files-found: error

  diagnose:
    if: inputs.mode == 'diagnose'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ''
    steps:
      - name: Check out the accepted artifact source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.source }}
          path: source
          persist-credentials: false
      - name: Check out the diagnostic at the workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: operator
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Retrieve and validate the accepted rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.candidate_run }}
        run: |
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name candidate-0.8.0 --dir "$CANDIDATE"
          python3 source/scripts/package.py check "$CANDIDATE"
      - name: Install the client from the failed publication
        run: npm install --global --ignore-scripts npm@11.19.1 --registry=https://registry.npmjs.org/
      - name: Diagnose npm 11.19.1 without uploading
        working-directory: source
        run: node ../operator/scripts/diagnose-npm-oidc.cjs 11.19.1
      - name: Install the current pinned client for comparison
        run: npm install --global --ignore-scripts npm@12.2.1 --registry=https://registry.npmjs.org/
      - name: Diagnose npm 12.2.1 without uploading
        working-directory: source
        run: node ../operator/scripts/diagnose-npm-oidc.cjs 12.2.1

  publish:
    if: inputs.mode == 'publish'
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: rustup toolchain install --no-self-update
      - name: Retrieve the accepted rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.candidate_run }}
        run: gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name candidate-0.8.0 --dir "$CANDIDATE"
      - name: Validate source and registry state
        run: |
          python3 scripts/package.py check "$CANDIDATE"
          python3 scripts/package.py registry "$CANDIDATE"
      - name: Promote the npm archive
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          state=$(python3 -c 'import json,os; print(next(p["status"] for p in json.load(open(os.environ["CANDIDATE"]+"/registry.json")) if p["name"] == "@bitspark/horos"))')
          if [ "$state" = absent ]; then
            npm publish "$CANDIDATE/bitspark-horos-0.8.0.tgz" --access public --provenance --registry=https://registry.npmjs.org/
          fi
      - id: cratesio-auth
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the reproduced crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          state=$(python3 -c 'import json,os; print(next(p["status"] for p in json.load(open(os.environ["CANDIDATE"]+"/registry.json")) if p["name"] == "bitspark-horos"))')
          if [ "$state" = absent ]; then
            python3 scripts/package.py reproduce-crate "$CANDIDATE"
            cargo publish --locked -p bitspark-horos
          fi

  verify:
    if: always() && needs.gate.result == 'success' && (inputs.mode == 'verify' || (inputs.mode == 'publish' && needs.publish.result == 'success'))
    needs: [gate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false
      - run: rustup toolchain install --no-self-update
      - name: Retrieve accepted rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.candidate_run }}
        run: gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name candidate-0.8.0 --dir "$CANDIDATE"
      - name: Verify published archives and anonymous consumers
        env:
          ACCEPTED_CI: ${{ needs.gate.outputs.ci }}
        run: |
          python3 scripts/package.py registry "$CANDIDATE" --required --wait
          python3 scripts/consumer.py published "$CANDIDATE"
      - name: Finalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/finalize-release.py "$CANDIDATE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-0.8.0
          path: ${{ env.CANDIDATE }}
          if-no-files-found: error
