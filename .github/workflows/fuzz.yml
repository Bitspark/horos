name: nightly conformance
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: rustup toolchain install --no-self-update
      - run: bash scripts/check.sh conformance
      - run: python3 conformance/run.py --seed "$GITHUB_RUN_NUMBER" --count 2000
