name: nightly conformance
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: rustup toolchain install --no-self-update
      - name: Public Python dependency
        run: git -c credential.helper= clone --depth 1 --branch v0.17.0 https://github.com/Bitspark/ontos.git "$RUNNER_TEMP/ontos"
      - run: bash scripts/check.sh conformance
        env:
          ONTOS_PY_ROOT: ${{ runner.temp }}/ontos
      - run: python3 conformance/run.py --seed "$GITHUB_RUN_NUMBER" --count 2000
        env:
          ONTOS_PY_ROOT: ${{ runner.temp }}/ontos
